<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torneios &amp; Campeonatos</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--verde-campo); }
  .carregando { color: var(--giz); font-family: var(--fonte-placar); letter-spacing: 0.08em; font-size: 1rem; }
  .erro-config { color: var(--giz); max-width: 420px; text-align: center; padding: 0 1.5rem; }
  .erro-config p { font-family: var(--fonte-texto); font-size: 0.92rem; line-height: 1.5; opacity: 0.9; }
  .erro-config code { background: rgba(0,0,0,0.25); padding: 0.15rem 0.4rem; border-radius: 4px; }
</style>
</head>
<body>
  <div class="carregando" id="telaCarregando">CARREGANDO...</div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { requireAuth, configuracaoPendente, MSG_CONFIG_PENDENTE } from "./js/auth.js";

  function mostrarErro(msg) {
    document.getElementById("telaCarregando").outerHTML =
      `<div class="erro-config"><p>${msg}</p></div>`;
  }

  if (configuracaoPendente()) {
    mostrarErro(MSG_CONFIG_PENDENTE);
  } else {
    // Se já houver sessão válida, manda para o painel certo; senão, para o login.
    onAuthStateChanged(
      auth,
      async (user) => {
        if (!user) {
          window.location.href = "login.html";
          return;
        }
        try {
          const perfil = await requireAuth(["admin", "responsavel"]);
          window.location.href = perfil.tipo === "admin" ? "admin.html" : "equipe.html";
        } catch (err) {
          mostrarErro(err.message);
        }
      },
      (err) => mostrarErro("Não foi possível conectar ao Firebase: " + err.message)
    );
  }
</script>
</body>
</html>
