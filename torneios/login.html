<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Sistema de Torneios e Campeonatos</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .tela {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
  }

  /* Painel esquerdo — identidade / placar decorativo */
  .painel-marca {
    background: var(--verde-campo);
    color: var(--giz);
    padding: 3rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  .painel-marca::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(246,243,234,0.05) 0 1px, transparent 1px 64px),
      repeating-linear-gradient(90deg, rgba(246,243,234,0.05) 0 1px, transparent 1px 64px);
    pointer-events: none;
  }
  .marca-topo { display: flex; align-items: center; gap: 0.6rem; z-index: 1; }
  .marca-topo .bola { font-size: 1.4rem; }
  .marca-topo span { font-family: var(--fonte-placar); font-size: 1.1rem; letter-spacing: 0.08em; }

  .placar-widget {
    z-index: 1;
    align-self: flex-start;
    margin-top: 2.5rem;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(246,243,234,0.18);
    border-radius: var(--radius-md);
    padding: 1.4rem 1.6rem;
    width: fit-content;
  }
  .placar-widget .rotulo {
    font-family: var(--fonte-digitos);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    color: var(--ouro-apito);
    margin-bottom: 0.6rem;
  }
  .placar-linha {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    font-family: var(--fonte-digitos);
    font-size: 2.6rem;
    line-height: 1;
  }
  .placar-linha .time { font-family: var(--fonte-placar); font-size: 1.3rem; letter-spacing: 0.05em; }
  .placar-linha .digito {
    background: rgba(246,243,234,0.1);
    border-radius: var(--radius-sm);
    padding: 0.1rem 0.5rem;
    min-width: 1.6ch;
    text-align: center;
  }
  .placar-linha .sep { color: var(--ouro-apito); }

  .marca-rodape { z-index: 1; }
  .marca-rodape h1 { font-size: 2.1rem; line-height: 1.15; max-width: 22ch; }
  .marca-rodape p { font-family: var(--fonte-texto); font-weight: 400; opacity: 0.82; margin-top: 0.8rem; max-width: 32ch; }

  /* Painel direito — formulário estilo "credencial" */
  .painel-form {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .credencial {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: var(--radius-md);
    box-shadow: var(--sombra-cartao);
    overflow: hidden;
  }
  .credencial-topo {
    padding: 1.6rem 1.8rem 1.2rem;
    border-bottom: 2px dashed var(--linha-campo);
    position: relative;
  }
  .credencial-topo::before,
  .credencial-topo::after {
    content: "";
    position: absolute;
    bottom: -9px;
    width: 18px;
    height: 18px;
    background: var(--giz);
    border-radius: 50%;
  }
  .credencial-topo::before { left: -9px; }
  .credencial-topo::after  { right: -9px; }

  .credencial-topo .eyebrow {
    font-family: var(--fonte-digitos);
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--verde-grama);
  }
  .credencial-topo h2 { font-size: 1.5rem; margin-top: 0.3rem; color: var(--verde-campo); }

  .credencial-corpo { padding: 1.6rem 1.8rem 1.9rem; }
  .campo { margin-bottom: 1.1rem; }
  .campo label {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
  }
  .campo input {
    width: 100%;
    padding: 0.7rem 0.8rem;
    border: 1.5px solid var(--linha-campo);
    border-radius: var(--radius-sm);
    font-family: var(--fonte-texto);
    font-size: 0.95rem;
  }
  .campo input:focus {
    outline: none;
    border-color: var(--verde-grama);
  }

  .credencial-corpo .btn-primario { width: 100%; margin-top: 0.4rem; }
  .mensagem-erro { min-height: 1.2rem; margin-top: 0.6rem; }

  @media (max-width: 860px) {
    .tela { grid-template-columns: 1fr; }
    .painel-marca { padding: 2rem; min-height: 260px; }
    .placar-widget { margin-top: 1.5rem; }
    .marca-rodape h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>
<div class="tela">

  <div class="painel-marca">
    <div class="marca-topo"><span class="bola">⚽</span><span>TORNEIOS &amp; CAMPEONATOS</span></div>

    <div class="placar-widget">
      <div class="rotulo">SÚMULA DE ACESSO</div>
      <div class="placar-linha">
        <span class="time">CASA</span>
        <span class="digito" id="digitoCasa">0</span>
        <span class="sep">:</span>
        <span class="digito" id="digitoFora">0</span>
        <span class="time">VISIT.</span>
      </div>
    </div>

    <div class="marca-rodape">
      <h1>Gestão completa de campeonatos, times e atletas.</h1>
      <p>Acesse com a conta liberada pelo administrador do sistema.</p>
    </div>
  </div>

  <div class="painel-form">
    <form class="credencial" id="formLogin">
      <div class="credencial-topo">
        <div class="eyebrow">ACESSO AO SISTEMA</div>
        <h2>Entrar</h2>
      </div>
      <div class="credencial-corpo">
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" required autocomplete="username" placeholder="seuemail@exemplo.com">
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primario" id="btnEntrar">Entrar</button>
        <div class="mensagem-erro erro" id="mensagemErro"></div>
      </div>
    </form>
  </div>

</div>

<script type="module">
  import { login } from "./js/auth.js";

  // Pequena animação decorativa do placar (não tem função de dados)
  const dCasa = document.getElementById("digitoCasa");
  const dFora = document.getElementById("digitoFora");
  let a = 0, b = 0;
  setInterval(() => {
    a = (a + (Math.random() > 0.7 ? 1 : 0)) % 10;
    b = (b + (Math.random() > 0.85 ? 1 : 0)) % 10;
    dCasa.textContent = a;
    dFora.textContent = b;
  }, 2200);

  const form = document.getElementById("formLogin");
  const btn = document.getElementById("btnEntrar");
  const msg = document.getElementById("mensagemErro");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.textContent = "";
    btn.disabled = true;
    btn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    try {
      const perfil = await login(email, senha);
      window.location.href = perfil.tipo === "admin" ? "admin.html" : "equipe.html";
    } catch (err) {
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
