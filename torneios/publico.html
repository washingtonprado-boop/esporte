<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonatos — Torneios &amp; Campeonatos</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { background: var(--giz); }
  .topo { background: var(--verde-campo); color: var(--giz); padding: 2.2rem 1.6rem; }
  .topo-conteudo { max-width: 960px; margin: 0 auto; }
  .topo-conteudo .marca { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
  .topo-conteudo .marca span { font-family: var(--fonte-placar); letter-spacing: 0.06em; }
  .topo-conteudo h1 { font-size: 1.7rem; }

  .lista { max-width: 960px; margin: -1.4rem auto 3rem; padding: 0 1.6rem; display: grid; gap: 1rem; }
  .item-campeonato {
    background: #fff; border-radius: var(--radius-md); box-shadow: var(--sombra-cartao);
    padding: 1.2rem 1.4rem; display: flex; align-items: center; gap: 1rem; text-decoration: none; color: var(--carvao);
  }
  .item-campeonato img { width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover; background: var(--linha-campo); }
  .item-campeonato .nome { font-family: var(--fonte-placar); font-size: 1.15rem; }
  .item-campeonato .detalhe { font-size: 0.82rem; opacity: 0.65; }
  .vazio { max-width: 960px; margin: 3rem auto; text-align: center; opacity: 0.6; padding: 0 1.6rem; }
</style>
</head>
<body>
  <div class="topo">
    <div class="topo-conteudo">
      <div class="marca">⚽ <span>TORNEIOS &amp; CAMPEONATOS</span></div>
      <h1>Campeonatos disponíveis</h1>
    </div>
  </div>

  <div class="lista" id="listaCampeonatosPublicos"></div>
  <div class="vazio" id="vazioListaPublica" style="display:none;">Nenhum campeonato disponível para consulta pública no momento.</div>

<script type="module">
import { listarCampeonatosPublicos } from "./js/campeonatos.js";

const IMG_PADRAO = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='#D8D2C2'/></svg>`
);

const campeonatos = await listarCampeonatosPublicos();
const lista = document.getElementById("listaCampeonatosPublicos");
document.getElementById("vazioListaPublica").style.display = campeonatos.length ? "none" : "block";

lista.innerHTML = campeonatos.map((c) => `
  <a class="item-campeonato" href="campeonato.html?id=${c.id}">
    <img src="${c.logoUrl || IMG_PADRAO}" alt="">
    <div>
      <div class="nome">${c.nome}</div>
      <div class="detalhe">${c.modalidade || ""} ${c.local ? "· " + c.local : ""}</div>
    </div>
  </a>`).join("");
</script>
</body>
</html>
